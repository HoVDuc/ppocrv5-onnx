[project]
name = "ppocrv5-onnx"
version = "1.1.0"
description = "PP-OCRv5/PP-OCRv6 ONNX runtime with uv"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "onnxruntime; platform_system != 'Linux' or platform_machine != 'x86_64'",
  "onnxruntime==1.*; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "opencv-python",
  "numpy",
  "omegaconf",
  "pyyaml",
  "pillow",
  "loguru",
  "pyclipper",
]

[build-system]
requires = ["setuptools>=64"]
# setuptools with editable installs defaulting to editable_mode=compat so that
# editors can resolve the package (see _build_backend/backend.py).
build-backend = "backend"
backend-path = ["_build_backend"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ppocrv5_onnx", "ppocrv5_onnx.*"]
namespaces = false

[tool.setuptools.package-data]
ppocrv5_onnx = [
  "data/dict/ppocrv5_dict.txt",
  "data/dict/ppocrv6_dict.txt",
  "data/fonts/simfang.ttf",
]
